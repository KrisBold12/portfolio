[project]
name = "dogbreed-serving"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "KrisBold12", email = "kristianboldini@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "numpy>=2.5.2",
    "onnxruntime>=1.28.0",
    "pillow>=12.3.0",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.52.1",
]

[project.scripts]
dogbreed-serving = "dogbreed_serving:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"
