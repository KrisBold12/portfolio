# Deployment for the VPS. Lives in the repo rather than on the server so that
# what is running is answerable from git rather than from someone's memory of
# what they typed over SSH.
#
# The VPS holds a clone of this repository at /opt/portfolio, so a deploy is a
# pull rather than a copy. Copying the file over would have broken the claim
# above the moment anyone edited the copy: nothing would have noticed. With a
# clone, `git log -1` on the server answers what is deployed and `git status`
# answers whether anyone touched it by hand.
#
#   ssh ubuntu@<host> "cd /opt/portfolio && git pull \
#     && docker compose -f serving/compose.yaml pull \
#     && docker compose -f serving/compose.yaml up -d"
#
# The directory is named for the repository and the compose project for the
# service, because the repository will hold more than one of these. The name
# below is what gives the stack its identity, so moving the directory does not
# create a second copy of it.
name: dogbreed

services:
  api:
    # Pinned to a commit, not to :latest. A deploy is then a one-line change
    # with a diff, and `docker compose up -d` on an unchanged file is a no-op
    # instead of a silent version bump.
    image: ghcr.io/krisbold12/dogbreed-serving:7226d19

    # Bound to loopback, not 0.0.0.0. nginx is the only thing that reaches the
    # API, so TLS, the upload size limit and the access log cannot be bypassed
    # by anyone who finds the host and guesses the port.
    ports:
      - "127.0.0.1:8000:8000"

    restart: unless-stopped

    # The default json-file driver grows without bound; on a 75 GB disk that
    # takes a while to matter and then matters all at once.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    # Measured peak is 361 MB with four concurrent requests. The cap is not
    # there to save memory, it is there so a leak takes the container down
    # instead of the host.
    mem_limit: 1g

    # OMP_NUM_THREADS, DOGBREED_MODEL_DIR and the HEALTHCHECK are baked into
    # the image; nothing here should need to restate them. If a value has to be
    # overridden at deploy time, it belongs in the Dockerfile's defaults being
    # wrong, not in a second source of truth here.
