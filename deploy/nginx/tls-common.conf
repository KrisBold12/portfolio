# Shared TLS settings, included by every server block that terminates TLS.
#
# Written out rather than `include /etc/letsencrypt/options-ssl-nginx.conf`,
# which only exists if certbot's nginx *installer* has run. This deployment uses
# `certbot certonly --webroot` so that nginx configuration stays in the repo,
# and that path never writes those files. Depending on them would make the
# config work or fail depending on how the certificate happened to be obtained.
#
# No ssl_dhparam: it is only consulted for DHE ciphersuites, and none are
# enabled here. No OCSP stapling either — Let's Encrypt is retiring OCSP, so
# turning it on buys a warning in the log rather than a faster handshake.

ssl_protocols TLSv1.3 TLSv1.2;

# Server preference off: with TLS 1.3 and this shortlist, the client is better
# placed than we are to know which of these its hardware accelerates.
ssl_prefer_server_ciphers off;
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;

ssl_session_cache shared:SSL:10m;
ssl_session_timeout 1d;

# Off because session tickets without key rotation weaken forward secrecy, and
# a single-origin site with a session cache does not need them.
ssl_session_tickets off;
