# kb-portfolio.dev
#
# One origin for the whole site: nginx serves the built React app and forwards
# /api to the container on loopback. That is why there is no CORS configuration
# anywhere in the FastAPI service — from the browser's point of view there is
# only one host.
#
# Written by hand rather than generated by `certbot --nginx`, so this file stays
# the source of truth and the server is a copy of it. Certificates are obtained
# with `certbot certonly --webroot`, which issues without touching nginx config.
#
# The server holds a clone of this repository at /opt/portfolio and symlinks
# both files into place, so `git pull` updates the configuration and nothing is
# copied by hand. Copying is what this file used to document, and it made the
# sentence above false: an edit made on the server would have been invisible to
# git, which is the thing the sentence promises cannot happen.
#
#   sudo ln -sfn /opt/portfolio/deploy/nginx/tls-common.conf /etc/nginx/snippets/tls-common.conf
#   sudo ln -sfn /opt/portfolio/deploy/nginx/kb-portfolio.conf /etc/nginx/sites-available/kb-portfolio.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# Both links are needed: this file `include`s tls-common.conf from
# /etc/nginx/snippets/, so `nginx -t` fails on a fresh host if only one of them
# was linked.

server {
    listen 80;
    listen [::]:80;
    server_name kb-portfolio.dev www.kb-portfolio.dev;

    # The ACME challenge has to stay reachable over plain HTTP, or renewal
    # fails in ninety days with the site apparently working fine.
    #
    # This one keeps pointing at /var/www/kb-portfolio while the site root
    # moved into the clone. The path is recorded in certbot's own renewal
    # configuration, so changing it here alone would break renewal quietly, and
    # there is nothing to gain: the directory holds challenge files certbot
    # writes and never anything from git.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/kb-portfolio;
    }

    location / {
        return 301 https://kb-portfolio.dev$request_uri;
    }
}

# www exists so the name resolves, and does nothing else. One canonical URL.
server {
    # nginx 1.24 has no standalone http2 directive; it arrived in 1.25.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.kb-portfolio.dev;

    ssl_certificate     /etc/letsencrypt/live/kb-portfolio.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kb-portfolio.dev/privkey.pem;
    include /etc/nginx/snippets/tls-common.conf;

    return 301 https://kb-portfolio.dev$request_uri;
}

server {
    # nginx 1.24 has no standalone http2 directive; it arrived in 1.25.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name kb-portfolio.dev;

    ssl_certificate     /etc/letsencrypt/live/kb-portfolio.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kb-portfolio.dev/privkey.pem;
    include /etc/nginx/snippets/tls-common.conf;

    # The build output inside the clone, not a copy of it. `npm run build` runs
    # on the server and writes here, so deploying the front end is a pull and a
    # build with no upload step, and what is served is answerable from git the
    # same way the pinned image tag answers for the API.
    root /opt/portfolio/web/dist;
    index index.html;

    server_tokens off;

    # Without this the responses say `Content-Type: text/html` and nothing
    # more. Browsers fall back to the document's own <meta charset>, but a
    # client that trusts the header instead defaults to ISO-8859-1 and mangles
    # every em dash and accented character in the page.
    charset utf-8;

    # .dev is on the HSTS preload list, so browsers already refuse plain HTTP
    # here. The header is sent anyway: it costs nothing and it is what makes the
    # policy true for anything not in the list.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Slightly above the application's own 10 MiB limit, on purpose. Anything
    # between the two is refused by the app, which answers with a JSON detail
    # naming the limit; nginx's bare 413 page is the backstop for the absurd.
    client_max_body_size 12m;

    location /api/ {
        # Trailing slash on both sides: /api/predict reaches the service as
        # /predict. Drop either one and every call 404s.
        proxy_pass http://127.0.0.1:8000/;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Inference is around 100 ms and the whole request is synchronous, so
        # the defaults are ample. They are stated rather than inherited so that
        # a slower model later fails visibly here instead of mysteriously.
        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;

        proxy_buffering off;
    }

    # Vite fingerprints these, so the filename changes whenever the bytes do and
    # they can be cached as long as anything ever is.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Everything not under /assets/ is HTML or an unfingerprinted file, and
    # none of it may be cached. HTML points at the fingerprinted assets, so a
    # stale copy pins a returning visitor to the previous deploy until their
    # own cache expires.
    #
    # The header lives here rather than on `= /index.html`, which is what this
    # was before the build started prerendering: the project page is requested
    # as /projects/dog-breed, and although the file behind it is an index.html,
    # location matching sees the URI and that URI has no extension. An exact
    # match on /index.html therefore covered the home page and quietly missed
    # every other route.
    #
    # $uri/index.html before $uri/, so a prerendered route is served rather
    # than redirected to. With $uri/ first, nginx finds the directory and
    # answers /projects/dog-breed with a 301 to the same path plus a slash;
    # that is the URL the site's own links use and the one canonical declares,
    # so the canonical target redirected and unfurlers that do not follow
    # redirects saw nothing. Naming the file skips the redirect entirely.
    #
    # The last entry is the SPA rewrite, now reached only by paths that are
    # genuinely unknown rather than by every route.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/index.html $uri/ /index.html;
    }
}
