[project]
name = "dog-breed"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "KrisBold12", email = "kristianboldini@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "requests>=2.34.2",
    "scikit-learn>=1.9.0",
    "scipy>=1.18.0",
    "timm>=1.0.28",
    "torch>=2.13.0",
    "torchvision>=0.28.0",
    "tqdm>=4.70.0",
]

[project.scripts]
dog-breed = "dog_breed:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index="pytorch" }
torchvision = { index = "pytorch" }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "dataset: needs the extracted dataset on disk (~750 MB); skipped when absent",
]
